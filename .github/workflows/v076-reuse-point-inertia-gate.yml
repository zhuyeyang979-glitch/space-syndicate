name: V076 Reuse and Point-Inertia Gate

"on":
  pull_request:
    branches:
      - codex/v075-monster-military-combat-bd0af5c
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        default: "93"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v076-reuse-point-inertia-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  reuse-point-inertia-gate:
    name: V076 Reuse and Point-Inertia Gate
    runs-on: windows-2022
    # A committed-only Raw scan currently takes about 18 minutes on the
    # windows-2022 runner.  FULL_CONVERGENCE deliberately performs a second,
    # byte-parity Raw execution before accepting the correction result, so the
    # previous 20-minute job limit could only cancel valid work in flight.
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Resolve exact pull-request context
        id: pr_context
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ("${{ github.event_name }}" -eq "pull_request") {
            $pull = $event.pull_request
          } else {
            $prNumber = "${{ inputs.pr_number }}"
            if ($prNumber -notmatch '^\d+$') {
              throw "workflow_dispatch requires a numeric PR number: $prNumber"
            }
            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $pull = Invoke-RestMethod `
              -Method Get `
              -Uri "https://api.github.com/repos/${{ github.repository }}/pulls/$prNumber" `
              -Headers $headers
          }
          $head = [string]$pull.head.sha
          $base = [string]$pull.base.sha
          $number = [string]$pull.number
          if ($head -notmatch '^[0-9a-f]{40}$' -or $base -notmatch '^[0-9a-f]{40}$') {
            throw "Resolved PR identity is incomplete: number=$number base=$base head=$head"
          }
          $contextPath = Join-Path $env:RUNNER_TEMP "v076-pr-context.json"
          [pscustomobject]@{
            number = [int]$number
            head_sha = $head
            base_sha = $base
            body = [string]$pull.body
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $contextPath -Encoding utf8
          "head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ steps.pr_context.outputs.head }}

      - name: Verify exact identity and clean source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedHead = "${{ steps.pr_context.outputs.head }}"
          $baseHead = "${{ steps.pr_context.outputs.base }}"
          $actualHead = (git rev-parse HEAD).Trim()
          if ($actualHead -cne $expectedHead) {
            throw "Checkout mismatch: expected=$expectedHead actual=$actualHead"
          }
          & git merge-base --is-ancestor $baseHead $actualHead
          if ($LASTEXITCODE -ne 0) {
            throw "PR head is not a descendant of its exact base: base=$baseHead head=$actualHead"
          }
          $status = (& git status --porcelain=v1 -uall | Out-String).Trim()
          if (-not [string]::IsNullOrEmpty($status)) {
            throw "Gate checkout must start clean: $status"
          }
          git diff --check "$baseHead...$actualHead"
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed for $baseHead...$actualHead"
          }

      - name: Resolve the exact gate delta base
        id: gate_base
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $head = "${{ steps.pr_context.outputs.head }}"
          $gateBase = "f6fe547e1e1db57a8bb3a12eab1d9225d4abdca5"
          $ledgerPath = "docs/architecture/V076_INHERITED_GREEN_LEDGER.json"
          $ledger = Get-Content -LiteralPath $ledgerPath -Raw | ConvertFrom-Json
          $declaredBase = [string]$ledger.point_inertia_baseline_sha
          if ($declaredBase -cne $gateBase) {
            throw "Ledger cannot redefine the external activation baseline: declared=$declaredBase required=$gateBase"
          }
          & git cat-file -e "$gateBase^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical point-inertia baseline commit is unavailable: $gateBase"
          }
          & git merge-base --is-ancestor $gateBase $head
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical point-inertia baseline is not an ancestor: base=$gateBase head=$head"
          }

          if ([string]$event.action -eq "synchronize") {
            $before = [string]$event.before
            if ($before -notmatch '^[0-9a-f]{40}$') {
              throw "Synchronize event lacks an exact before identity: $before"
            }
            & git merge-base --is-ancestor $before $head
            if ($LASTEXITCODE -ne 0) {
              throw "Non-fast-forward synchronize history drift: before=$before head=$head"
            }
            & git merge-base --is-ancestor $gateBase $before
            if ($LASTEXITCODE -ne 0) {
              throw "Synchronize before predates or diverges from Gate activation: activation=$gateBase before=$before"
            }
          }

          "gate_base=$gateBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "V076_GATE_BASE_REF=$gateBase"
          Write-Output "V076_GATE_BASE_SOURCE=external_activation_boundary"

      - name: Run existing 120/120 self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receiptPath = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-selftest.json"
          $receiptLines = & python tools/v076/v076_reuse_point_inertia_gate_selftest.py
          $selftestExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $receiptPath,
            (($receiptLines -join "`n").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          } catch {
            throw "Existing reuse self-test did not emit a valid JSON receipt: $($_.Exception.Message)"
          }
          $caseCount = [int]$receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_CASE_COUNT
          $passCount = [int]$receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_PASS_COUNT
          if (
            $selftestExit -ne 0 -or
            [string]$receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_STATUS -cne "PASS" -or
            $caseCount -lt 120 -or
            $passCount -ne $caseCount
          ) {
            throw "Existing reuse self-test failed: exit=$selftestExit status=$($receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_STATUS) pass=$passCount/$caseCount"
          }
          "Existing reuse self-test: PASS ($passCount/$caseCount)" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run V2 exact-correction self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receiptPath = Join-Path $env:RUNNER_TEMP "v076-reuse-correction-v2-selftest.json"
          $receiptLines = & python tools/v076/v076_reuse_exact_failure_correction_v2_selftest.py
          $selftestExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $receiptPath,
            (($receiptLines -join "`n").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          } catch {
            throw "V2 correction self-test did not emit a valid JSON receipt: $($_.Exception.Message)"
          }
          $caseCount = [int]$receipt.CORRECTION_V2_SELFTEST_CASE_COUNT
          $passCount = [int]$receipt.CORRECTION_V2_SELFTEST_PASS_COUNT
          if (
            $selftestExit -ne 0 -or
            [string]$receipt.CORRECTION_V2_SELFTEST_STATUS -cne "PASS" -or
            $caseCount -lt 60 -or
            $passCount -ne $caseCount
          ) {
            throw "V2 correction self-test failed: exit=$selftestExit status=$($receipt.CORRECTION_V2_SELFTEST_STATUS) pass=$passCount/$caseCount"
          }
          "V2 exact-correction self-test: PASS ($passCount/$caseCount)" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run current-subject receipt-contract self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receiptPath = Join-Path $env:RUNNER_TEMP "v076-current-subject-receipt-contract-selftest.json"
          $receiptLines = & python tools/v076/v076_current_subject_revalidation_receipt_selftest.py
          $selftestExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $receiptPath,
            (($receiptLines -join "`n").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          } catch {
            throw "Current-subject receipt self-test did not emit valid JSON: $($_.Exception.Message)"
          }
          $caseCount = [int]$receipt.RECEIPT_CONTRACT_SELFTEST_CASE_COUNT
          $passCount = [int]$receipt.RECEIPT_CONTRACT_SELFTEST_PASS_COUNT
          $negativeCaseCountProperty = $receipt.PSObject.Properties[
            "RECEIPT_CONTRACT_SELFTEST_NEGATIVE_CASE_COUNT"
          ]
          $executedNegativeSetMatchProperty = $receipt.PSObject.Properties[
            "EXECUTED_NEGATIVE_CASE_SET_MATCH"
          ]
          $classifiedFalseGreenFields = @(
            "FROZEN_ATTESTATION_TAMPER_FALSE_GREEN_COUNT",
            "AUDIT_P1_NO_GO_FALSE_GREEN_COUNT",
            "NEGATIVE_FIXTURE_CATALOG_FALSE_GREEN_COUNT",
            "TOOL_DEPENDENCY_INVENTORY_FALSE_GREEN_COUNT",
            "RESUME_CHECKPOINT_FALSE_GREEN_COUNT",
            "POST_SEAL_INPUT_DRIFT_FALSE_GREEN_COUNT"
          )
          $invalidClassifiedFalseGreenFields = @(
            $classifiedFalseGreenFields |
              Where-Object {
                $property = $receipt.PSObject.Properties[[string]$_]
                $null -eq $property -or
                  $property.Value -isnot [long] -or
                  [long]$property.Value -ne 0
              }
          )
          if (
            $selftestExit -ne 0 -or
            [string]$receipt.RECEIPT_CONTRACT_SELFTEST_STATUS -cne "PASS" -or
            $caseCount -ne 140 -or
            $passCount -ne $caseCount -or
            $null -eq $negativeCaseCountProperty -or
            $negativeCaseCountProperty.Value -isnot [long] -or
            [long]$negativeCaseCountProperty.Value -ne 118 -or
            $null -eq $executedNegativeSetMatchProperty -or
            $executedNegativeSetMatchProperty.Value -isnot [bool] -or
            $executedNegativeSetMatchProperty.Value -ne $true -or
            [string]$receipt.NEGATIVE_FIXTURE_CATALOG_SHA256 -cne "26129c2720bf6c252bc219127ba47c420a7672912135082da0c28c3c8a02797a" -or
            [long]$receipt.FALSE_GREEN_COUNT -ne 0 -or
            [long]$receipt.VALID_RECEIPT_FALSE_REJECT_COUNT -ne 0 -or
            $invalidClassifiedFalseGreenFields.Count -ne 0
          ) {
            throw "Current-subject receipt self-test failed: exit=$selftestExit status=$($receipt.RECEIPT_CONTRACT_SELFTEST_STATUS) pass=$passCount/$caseCount false_green=$($receipt.FALSE_GREEN_COUNT) valid_false_reject=$($receipt.VALID_RECEIPT_FALSE_REJECT_COUNT) invalid_classified=$($invalidClassifiedFalseGreenFields -join ',')"
          }
          "Current-subject receipt contract: PASS ($passCount/$caseCount); false green: 0." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run Generation 10 STEP11 receipt and runner self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receiptPath = Join-Path $env:RUNNER_TEMP "v076-generation10-step11-receipt-selftest.json"
          $runnerPath = Join-Path $env:RUNNER_TEMP "v076-generation10-step11-runner-selftest.json"
          $receiptLines = & python tools/v076/v076_generation10_step11_receipt_selftest.py
          $receiptExit = $LASTEXITCODE
          $runnerLines = & python tools/v076/v076_generation10_step11_runner_selftest.py
          $runnerExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $receiptPath,
            (($receiptLines -join "`n").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          [IO.File]::WriteAllText(
            $runnerPath,
            (($runnerLines -join "`n").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            $runner = Get-Content -LiteralPath $runnerPath -Raw | ConvertFrom-Json
          } catch {
            throw "Generation 10 self-tests did not emit valid JSON: $($_.Exception.Message)"
          }
          if ($receiptExit -ne 0 -or
              [string]$receipt.RECEIPT_CONTRACT_SELFTEST_STATUS -cne "PASS" -or
              [long]$receipt.RECEIPT_CONTRACT_SELFTEST_CASE_COUNT -ne 147 -or
              [long]$receipt.RECEIPT_CONTRACT_SELFTEST_PASS_COUNT -ne 147 -or
              [long]$receipt.RECEIPT_CONTRACT_SELFTEST_NEGATIVE_CASE_COUNT -ne 104 -or
              [long]$receipt.FALSE_GREEN_COUNT -ne 0 -or
              [long]$receipt.VALID_RECEIPT_FALSE_REJECT_COUNT -ne 0 -or
              $receipt.EXECUTED_NEGATIVE_CASE_SET_MATCH -ne $true) {
            throw "Generation 10 receipt self-test failed: exit=$receiptExit status=$($receipt.RECEIPT_CONTRACT_SELFTEST_STATUS) pass=$($receipt.RECEIPT_CONTRACT_SELFTEST_PASS_COUNT)/$($receipt.RECEIPT_CONTRACT_SELFTEST_CASE_COUNT)"
          }
          if ($runnerExit -ne 0 -or
              [string]$runner.status -cne "PASS" -or
              [long]$runner.case_count -lt 55 -or
              [long]$runner.pass_count -ne [long]$runner.case_count -or
              [long]$runner.false_green_count -ne 0) {
            throw "Generation 10 runner self-test failed: exit=$runnerExit status=$($runner.status) pass=$($runner.pass_count)/$($runner.case_count)"
          }
          "Generation 10 STEP11 receipt contract: PASS (147/147); dual-mode runner: PASS ($($runner.pass_count)/$($runner.case_count)); false green: 0." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Resolve explicit full-convergence input set
        id: full_convergence_inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # These paths are the complete, explicitly authorized terminal input
          # set.  Directory discovery is intentionally not an authority.
          $inputs = [ordered]@{
            baseline_report = "reports/reuse/correction_v2/epochs/full_convergence_20260827/baseline_raw_failure_report.json"
            batch_manifest = "docs/architecture/reuse_corrections/v2/batches/full_convergence_20260827/batch-010/batch-010-manifest.json"
            previous_batch_manifest = "docs/architecture/reuse_corrections/v2/batches/full_convergence_20260827/batch-009/batch-009-manifest.json"
            descendant_history_supplement = "reports/reuse/correction_v2/epochs/full_convergence_20260827/descendant_history_supplement_da48a74b_003.json"
            descendant_history_raw_report = "reports/reuse/correction_v2/epochs/full_convergence_20260827/descendant_history_raw_da48a74b_003.json"
            descendant_history_scanner = "tools/v076/v076_reuse_point_inertia_gate.py"
            post_touch_revalidation = "docs/architecture/reuse_corrections/v2/post_touch_revalidation/full_convergence_batch004_20260828_manifest.json"
            post_touch_revalidation_successor_v2 = "docs/architecture/reuse_corrections/v2/post_touch_revalidation_successor_v2/manifest.json"
            subject_projection_revalidation = "docs/architecture/reuse_corrections/v2/subject_projection_revalidation/manifest.json"
            subject_projection_revalidation_successor_v2 = "docs/architecture/reuse_corrections/v2/subject_projection_revalidation_successor_v2/manifest.json"
            subject_projection_revalidation_successor_v3 = "docs/architecture/reuse_corrections/v2/subject_projection_revalidation_successor_v3/manifest.json"
            subject_projection_revalidation_successor_v4 = "docs/architecture/reuse_corrections/v2/subject_projection_revalidation_successor_v4/manifest.json"
            subject_projection_revalidation_successor_v5 = "docs/architecture/reuse_corrections/v2/subject_projection_revalidation_successor_v5/manifest.json"
            subject_projection_revalidation_successor_v6 = "docs/architecture/reuse_corrections/v2/subject_projection_revalidation_successor_v6/manifest.json"
            historical_delta_metadata_ledger = "docs/architecture/V076_HISTORICAL_DELTA_METADATA_LEDGER.json"
            historical_delta_metadata_successor = "docs/architecture/reuse_corrections/v2/historical_delta_metadata_successor/manifest.json"
            historical_delta_metadata_successor_v2 = "docs/architecture/reuse_corrections/v2/historical_delta_metadata_successor_v2/manifest.json"
            current_subject_manifest = "reports/reuse/full_convergence/candidate_subject_manifest_ac5efcc5.json"
          }
          foreach ($entry in $inputs.GetEnumerator()) {
            $relative = [string]$entry.Value
            $absolute = Join-Path $env:GITHUB_WORKSPACE $relative
            if (-not (Test-Path -LiteralPath $absolute -PathType Leaf)) {
              throw "Explicit full-convergence input is missing: key=$($entry.Key) path=$relative"
            }
            & git ls-files --error-unmatch -- $relative *> $null
            if ($LASTEXITCODE -ne 0) {
              throw "Explicit full-convergence input is not committed: key=$($entry.Key) path=$relative"
            }
            "$($entry.Key)=$absolute" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            if ($entry.Key -ceq "current_subject_manifest") {
              "current_subject_manifest_relative=$relative" |
                Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            }
          }
          "Full-convergence explicit input set: COMPLETE ($($inputs.Count)/$($inputs.Count)); directory discovery: disabled." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Consume current authorized receipt generation (fail closed)
        id: current_subject_receipt_consumer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportPath = Join-Path $env:RUNNER_TEMP "v076-current-subject-receipt-validation.json"
          $generation10ManifestRelative = "reports/reuse/full_convergence/generation10/generation10_authorization_manifest_repair_012.json"
          $generation10ManifestPath = Join-Path $env:GITHUB_WORKSPACE $generation10ManifestRelative
          $generation9ManifestRelative = "reports/reuse/full_convergence/generation9/generation9_authorization_manifest_repair_004.json"
          $generation9ManifestPath = Join-Path $env:GITHUB_WORKSPACE $generation9ManifestRelative
          $generation8ManifestRelative = "reports/reuse/full_convergence/generation8/generation8_authorization_manifest.json"
          $generation8ManifestPath = Join-Path $env:GITHUB_WORKSPACE $generation8ManifestRelative
          $global:LASTEXITCODE = 0
          if (Test-Path -LiteralPath $generation10ManifestPath -PathType Leaf) {
            try {
              $generation10Authorization = Get-Content -LiteralPath $generation10ManifestPath -Raw | ConvertFrom-Json
            } catch {
              throw "Generation 10 authorization manifest is invalid JSON: $($_.Exception.Message)"
            }
            $generationProperty = $generation10Authorization.PSObject.Properties["generation_id"]
            $evidenceProperty = $generation10Authorization.PSObject.Properties["new_evidence_id"]
            if ([string]$generation10Authorization.status -cne "SEALED" -or
                $null -eq $generationProperty -or $generationProperty.Value -isnot [long] -or
                [long]$generationProperty.Value -ne 10 -or
                $null -eq $evidenceProperty -or $evidenceProperty.Value -isnot [long] -or
                [long]$evidenceProperty.Value -ne 9696) {
              throw "Generation 10 authorization manifest identity is not sealed or monotonic."
            }
            $expectedGenerationId = [long]$generationProperty.Value
            $expectedEvidenceId = [long]$evidenceProperty.Value
            $expectedReceiptCount = 1
            $expectedValidationMode = "GENERATION10_SUCCESSOR"
            & python tools/v076/v076_generation10_step11_receipt.py validate `
              --project $env:GITHUB_WORKSPACE `
              --expected-consumer-head "${{ steps.pr_context.outputs.head }}" `
              --report-json $reportPath
          } elseif (Test-Path -LiteralPath $generation9ManifestPath -PathType Leaf) {
            try {
              $generation9Authorization = Get-Content -LiteralPath $generation9ManifestPath -Raw | ConvertFrom-Json
            } catch {
              throw "Generation 9 authorization manifest is invalid JSON: $($_.Exception.Message)"
            }
            $generationProperty = $generation9Authorization.PSObject.Properties["generation_id"]
            $evidenceProperty = $generation9Authorization.PSObject.Properties["new_evidence_id"]
            if ([string]$generation9Authorization.status -cne "SEALED" -or
                $null -eq $generationProperty -or $generationProperty.Value -isnot [long] -or
                [long]$generationProperty.Value -ne 9 -or
                $null -eq $evidenceProperty -or $evidenceProperty.Value -isnot [long] -or
                [long]$evidenceProperty.Value -ne 9695) {
              throw "Generation 9 authorization manifest identity is not sealed or monotonic."
            }
            $expectedGenerationId = [long]$generationProperty.Value
            $expectedEvidenceId = [long]$evidenceProperty.Value
            $expectedReceiptCount = 1
            $expectedValidationMode = "GENERATION9_SUCCESSOR"
            & python tools/v076/v076_generation9_step11_receipt.py validate `
              --project $env:GITHUB_WORKSPACE `
              --expected-consumer-head "${{ steps.pr_context.outputs.head }}" `
              --report-json $reportPath
          } elseif (Test-Path -LiteralPath $generation8ManifestPath -PathType Leaf) {
            try {
              $generation8Authorization = Get-Content -LiteralPath $generation8ManifestPath -Raw | ConvertFrom-Json
            } catch {
              throw "Generation 8 authorization manifest is invalid JSON: $($_.Exception.Message)"
            }
            $generationProperty = $generation8Authorization.PSObject.Properties["generation_id"]
            $evidenceProperty = $generation8Authorization.PSObject.Properties["new_evidence_id"]
            if ([string]$generation8Authorization.status -cne "SEALED" -or
                $null -eq $generationProperty -or $generationProperty.Value -isnot [long] -or
                [long]$generationProperty.Value -ne 8 -or
                $null -eq $evidenceProperty -or $evidenceProperty.Value -isnot [long] -or
                [long]$evidenceProperty.Value -le 9631) {
              throw "Generation 8 authorization manifest identity is not sealed or monotonic."
            }
            $expectedGenerationId = [long]$generationProperty.Value
            $expectedEvidenceId = [long]$evidenceProperty.Value
            $expectedReceiptCount = 1
            $expectedValidationMode = "GENERATION8_SUCCESSOR"
            & python tools/v076/v076_current_subject_revalidation_receipt.py validate-generation8 `
              --project $env:GITHUB_WORKSPACE `
              --expected-consumer-head "${{ steps.pr_context.outputs.head }}" `
              --report-json $reportPath
          } else {
            $expectedGenerationId = 7
            $expectedEvidenceId = 9631
            $expectedReceiptCount = 3
            $expectedValidationMode = "GENERATION7_LEGACY"
            & python tools/v076/v076_current_subject_revalidation_receipt.py validate `
              --project $env:GITHUB_WORKSPACE `
              --subject-manifest "${{ steps.full_convergence_inputs.outputs.current_subject_manifest_relative }}" `
              --expected-consumer-head "${{ steps.pr_context.outputs.head }}" `
              --report-json $reportPath
          }
          $validatorExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Current-subject receipt validator emitted no structured report: exit=$validatorExit"
          }
          try {
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          } catch {
            throw "Current-subject receipt validator emitted invalid JSON: $($_.Exception.Message)"
          }
          $failureCodes = @($report.failure_codes)
          "exit_code=$validatorExit" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "expected_generation_id=$expectedGenerationId" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "expected_evidence_id=$expectedEvidenceId" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "expected_receipt_count=$expectedReceiptCount" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "expected_validation_mode=$expectedValidationMode" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($validatorExit -lt 0 -or $validatorExit -ge 2) {
            throw "Current-subject receipt validator tooling error: exit=$validatorExit"
          }
          $expectedValidatorStatus = if ($validatorExit -eq 0) { "PASS" } else { "FAIL" }
          if ([string]$report.validator_status -cne $expectedValidatorStatus) {
            throw "Current-subject receipt validator exit/report mismatch: exit=$validatorExit status=$($report.validator_status)"
          }
          if ($validatorExit -eq 0) {
            "Current authorized receipts: validator PASS ($expectedValidationMode); final Effective Gate will enforce the complete structured report." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            $stableCodes = ($failureCodes | Sort-Object -Unique) -join ","
            "Current authorized receipts: validator FAIL ($expectedValidationMode); downstream reuse enforcement blocked; codes=$stableCodes." |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Verify sealed V2 evidence
        if: ${{ steps.current_subject_receipt_consumer.outputs.exit_code == '0' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $verificationLines = & python tools/v076/v076_reuse_exact_failure_correction_v2.py seal-evidence `
            --project $env:GITHUB_WORKSPACE `
            --output-root $env:GITHUB_WORKSPACE `
            --verify-only
          $verificationExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($verificationExit -ne 0) {
            throw "Sealed V2 evidence verification tooling failure: exit=$verificationExit"
          }
          $verificationJson = ($verificationLines -join "`n").Trim()
          try {
            $verification = $verificationJson | ConvertFrom-Json
          } catch {
            throw "Sealed V2 evidence verification emitted invalid JSON: $($_.Exception.Message)"
          }
          $mutationProperty = $verification.PSObject.Properties[
            "POST_MANIFEST_INPUT_MUTATION_COUNT"
          ]
          if (
            [string]$verification.status -cne "VERIFIED" -or
            $null -eq $mutationProperty -or
            $mutationProperty.Value -isnot [long] -or
            [long]$mutationProperty.Value -ne 0 -or
            [string]$verification.REUSE_GATE_STATUS -cne "FAIL"
          ) {
            throw "Sealed V2 evidence verification mismatch: status=$($verification.status) mutation_count=$($verification.POST_MANIFEST_INPUT_MUTATION_COUNT) reuse_gate_status=$($verification.REUSE_GATE_STATUS)"
          }
          "Sealed V2 evidence: VERIFIED; post-manifest mutations: 0; sealed Gate status: FAIL (hard-stop preserved)." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run Raw Scanner and emit Raw Report
        id: raw_report
        if: ${{ steps.current_subject_receipt_consumer.outputs.exit_code == '0' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $context = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "v076-pr-context.json") -Raw | ConvertFrom-Json
          $prBodyPath = Join-Path $env:RUNNER_TEMP "v076-pr-body.md"
          $rawJson = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-raw.json"
          $rawMarkdown = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-raw.md"
          [IO.File]::WriteAllText(
            $prBodyPath,
            [string]$context.body,
            [Text.UTF8Encoding]::new($false)
          )

          # Exit 1 is the scanner's expected raw-failure result.  Preserve it
          # for V2 instead of terminating before exact correction resolution.
          $global:LASTEXITCODE = 0
          & python tools/v076/v076_reuse_point_inertia_gate.py validate `
            --project $env:GITHUB_WORKSPACE `
            --pr-base-ref "${{ steps.pr_context.outputs.base }}" `
            --inertia-base-ref "${{ steps.gate_base.outputs.gate_base }}" `
            --gate-base-ref "${{ steps.gate_base.outputs.gate_base }}" `
            --head-ref "${{ steps.pr_context.outputs.head }}" `
            --pr-body-file $prBodyPath `
            --report-json $rawJson `
            --report-md $rawMarkdown
          $rawExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          "exit_code=$rawExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($rawExit -lt 0 -or $rawExit -ge 2) {
            throw "Raw Scanner tooling error: exit=$rawExit"
          }
          if (-not (Test-Path -LiteralPath $rawJson -PathType Leaf) -or
              -not (Test-Path -LiteralPath $rawMarkdown -PathType Leaf)) {
            throw "Raw Scanner did not emit both required reports: json=$rawJson markdown=$rawMarkdown exit=$rawExit"
          }
          try {
            $raw = Get-Content -LiteralPath $rawJson -Raw | ConvertFrom-Json
          } catch {
            throw "Raw Scanner emitted invalid JSON: $($_.Exception.Message)"
          }
          $rawStatus = [string]$raw.status
          if (($rawExit -eq 0 -and $rawStatus -cne "PASS") -or
              ($rawExit -eq 1 -and $rawStatus -cne "FAIL")) {
            throw "Raw Scanner exit/report mismatch: exit=$rawExit status=$rawStatus"
          }
          Get-Content -LiteralPath $rawMarkdown -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($rawExit -eq 1) {
            Write-Warning "Raw Scanner found failures; V2 Resolver will determine the effective Gate result."
          }

      - name: Run V2 Resolver and emit V2 Report
        id: v2_resolver
        if: ${{ steps.current_subject_receipt_consumer.outputs.exit_code == '0' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rawJson = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-raw.json"
          $v2Json = Join-Path $env:RUNNER_TEMP "v076-reuse-correction-v2.json"
          $v2Markdown = Join-Path $env:RUNNER_TEMP "v076-reuse-correction-v2.md"
          $prBodyPath = Join-Path $env:RUNNER_TEMP "v076-pr-body.md"
          if (-not (Test-Path -LiteralPath $rawJson -PathType Leaf)) {
            throw "V2 Resolver requires the Raw Scanner report: $rawJson"
          }
          if (-not (Test-Path -LiteralPath $prBodyPath -PathType Leaf)) {
            throw "V2 Resolver requires the exact PR-body bytes used by the Raw Scanner: $prBodyPath"
          }

          # Exit 1 is a genuine effective Gate failure, not a tooling failure.
          # Keep this step successful long enough to publish both reports and
          # let the final Effective Gate enforce the result exactly once.
          $global:LASTEXITCODE = 0
          & python tools/v076/v076_reuse_exact_failure_correction_v2.py resolve `
            --project $env:GITHUB_WORKSPACE `
            --output-root $env:GITHUB_WORKSPACE `
            --head-ref "${{ steps.pr_context.outputs.head }}" `
            --raw-report $rawJson `
            --full-convergence-baseline-report "${{ steps.full_convergence_inputs.outputs.baseline_report }}" `
            --batch-manifest "${{ steps.full_convergence_inputs.outputs.batch_manifest }}" `
            --previous-batch-manifest "${{ steps.full_convergence_inputs.outputs.previous_batch_manifest }}" `
            --descendant-history-supplement "${{ steps.full_convergence_inputs.outputs.descendant_history_supplement }}" `
            --descendant-history-raw-report "${{ steps.full_convergence_inputs.outputs.descendant_history_raw_report }}" `
            --descendant-history-scanner "${{ steps.full_convergence_inputs.outputs.descendant_history_scanner }}" `
            --post-touch-revalidation "${{ steps.full_convergence_inputs.outputs.post_touch_revalidation }}" `
            --post-touch-revalidation-successor-v2 "${{ steps.full_convergence_inputs.outputs.post_touch_revalidation_successor_v2 }}" `
            --subject-projection-revalidation "${{ steps.full_convergence_inputs.outputs.subject_projection_revalidation }}" `
            --subject-projection-revalidation-successor-v2 "${{ steps.full_convergence_inputs.outputs.subject_projection_revalidation_successor_v2 }}" `
            --subject-projection-revalidation-successor-v3 "${{ steps.full_convergence_inputs.outputs.subject_projection_revalidation_successor_v3 }}" `
            --subject-projection-revalidation-successor-v4 "${{ steps.full_convergence_inputs.outputs.subject_projection_revalidation_successor_v4 }}" `
            --subject-projection-revalidation-successor-v5 "${{ steps.full_convergence_inputs.outputs.subject_projection_revalidation_successor_v5 }}" `
            --subject-projection-revalidation-successor-v6 "${{ steps.full_convergence_inputs.outputs.subject_projection_revalidation_successor_v6 }}" `
            --historical-delta-metadata-ledger "${{ steps.full_convergence_inputs.outputs.historical_delta_metadata_ledger }}" `
            --historical-delta-metadata-successor "${{ steps.full_convergence_inputs.outputs.historical_delta_metadata_successor }}" `
            --historical-delta-metadata-successor-v2 "${{ steps.full_convergence_inputs.outputs.historical_delta_metadata_successor_v2 }}" `
            --full-convergence-pr-body-file $prBodyPath `
            --report-json $v2Json `
            --report-md $v2Markdown
          $v2Exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          "exit_code=$v2Exit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($v2Exit -lt 0 -or $v2Exit -ge 2) {
            throw "V2 Resolver tooling error: exit=$v2Exit"
          }
          if (-not (Test-Path -LiteralPath $v2Json -PathType Leaf) -or
              -not (Test-Path -LiteralPath $v2Markdown -PathType Leaf)) {
            throw "V2 Resolver did not emit both required reports: json=$v2Json markdown=$v2Markdown exit=$v2Exit"
          }
          try {
            $v2 = Get-Content -LiteralPath $v2Json -Raw | ConvertFrom-Json
          } catch {
            throw "V2 Resolver emitted invalid JSON: $($_.Exception.Message)"
          }
          $v2Status = [string]$v2.status
          $passStatus = "PASS_WITH_APPEND_ONLY_HISTORICAL_IDENTITY_BACKFILL_AND_CORRECTIONS"
          $failStatus = "FAIL"
          if (($v2Exit -eq 0 -and $v2Status -cne $passStatus) -or
              ($v2Exit -eq 1 -and $v2Status -cne $failStatus)) {
            throw "V2 Resolver exit/report mismatch: exit=$v2Exit status=$v2Status"
          }
          Get-Content -LiteralPath $v2Markdown -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($v2Exit -eq 1) {
            Write-Warning "V2 Resolver found unresolved or active effective blockers."
          }

      - name: Enforce Effective Gate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receiptOutcome = "${{ steps.current_subject_receipt_consumer.outcome }}"
          $rawOutcome = "${{ steps.raw_report.outcome }}"
          $v2Outcome = "${{ steps.v2_resolver.outcome }}"
          $receiptExitText = "${{ steps.current_subject_receipt_consumer.outputs.exit_code }}"
          $rawExitText = "${{ steps.raw_report.outputs.exit_code }}"
          $v2ExitText = "${{ steps.v2_resolver.outputs.exit_code }}"
          $receiptJson = Join-Path $env:RUNNER_TEMP "v076-current-subject-receipt-validation.json"
          $rawJson = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-raw.json"
          $v2Json = Join-Path $env:RUNNER_TEMP "v076-reuse-correction-v2.json"

          $repositoryStatus = (& git status --porcelain=v1 -uall | Out-String).Trim()
          if (-not [string]::IsNullOrEmpty($repositoryStatus)) {
            throw "Gate mutated the repository; reports must remain in RUNNER_TEMP: $repositoryStatus"
          }
          if ($receiptOutcome -cne "success") {
            throw "Current-subject receipt consumer tooling failed: outcome=$receiptOutcome"
          }
          if ($receiptExitText -notmatch '^[01]$') {
            throw "Current-subject receipt consumer emitted invalid exit classification: $receiptExitText"
          }
          try {
            $receiptReport = Get-Content -LiteralPath $receiptJson -Raw | ConvertFrom-Json
          } catch {
            throw "Effective Gate could not parse the receipt validation report: $($_.Exception.Message)"
          }
          $expectedReceiptStatus = if ($receiptExitText -eq "0") { "PASS" } else { "FAIL" }
          if ([string]$receiptReport.validator_status -cne $expectedReceiptStatus) {
            throw "Effective Gate receipt exit/report mismatch: exit=$receiptExitText status=$($receiptReport.validator_status)"
          }
          $receiptExactIntegerFields = @(
            "generation_id",
            "resume_evidence_id",
            "receipt_count",
            "validated_receipt_count"
          )
          $invalidReceiptIntegerFields = @(
            $receiptExactIntegerFields |
              Where-Object {
                $property = $receiptReport.PSObject.Properties[[string]$_]
                $null -eq $property -or $property.Value -isnot [long]
              }
          )
          $receiptExactBooleanFields = @("required_gate_consumer_fail_closed")
          $invalidReceiptBooleanFields = @(
            $receiptExactBooleanFields |
              Where-Object {
                $property = $receiptReport.PSObject.Properties[[string]$_]
                $null -eq $property -or $property.Value -isnot [bool]
              }
          )
          $receiptFailureCodesProperty = $receiptReport.PSObject.Properties[
            "failure_codes"
          ]
          $receiptBindingsProperty = $receiptReport.PSObject.Properties[
            "receipt_bindings"
          ]
          $receiptFailureCodesType = if ($null -eq $receiptFailureCodesProperty -or
              $null -eq $receiptFailureCodesProperty.Value) {
            "MISSING"
          } else {
            $receiptFailureCodesProperty.Value.GetType().FullName
          }
          $receiptBindingsType = if ($null -eq $receiptBindingsProperty -or
              $null -eq $receiptBindingsProperty.Value) {
            "MISSING"
          } else {
            $receiptBindingsProperty.Value.GetType().FullName
          }
          if ($invalidReceiptIntegerFields.Count -ne 0 -or
              $invalidReceiptBooleanFields.Count -ne 0 -or
              $null -eq $receiptFailureCodesProperty -or
              $receiptFailureCodesProperty.Value -isnot [System.Array] -or
              $null -eq $receiptBindingsProperty -or
              $receiptBindingsProperty.Value -isnot [System.Array]) {
            throw "Effective Gate receipt report type mismatch: integers=$($invalidReceiptIntegerFields -join ',') booleans=$($invalidReceiptBooleanFields -join ',') failure_codes_type=$receiptFailureCodesType bindings_type=$receiptBindingsType"
          }
          $receiptFailureCodes = @($receiptReport.failure_codes)
          $receiptBindings = @($receiptReport.receipt_bindings)
          $expectedHead = "${{ steps.pr_context.outputs.head }}"
          $expectedGenerationText = "${{ steps.current_subject_receipt_consumer.outputs.expected_generation_id }}"
          $expectedEvidenceText = "${{ steps.current_subject_receipt_consumer.outputs.expected_evidence_id }}"
          $expectedReceiptCountText = "${{ steps.current_subject_receipt_consumer.outputs.expected_receipt_count }}"
          $expectedValidationMode = "${{ steps.current_subject_receipt_consumer.outputs.expected_validation_mode }}"
          if ($expectedGenerationText -notmatch '^[0-9]+$' -or
              $expectedEvidenceText -notmatch '^[0-9]+$' -or
              $expectedReceiptCountText -notmatch '^[0-9]+$' -or
              $expectedValidationMode -notin @("GENERATION7_LEGACY", "GENERATION8_SUCCESSOR", "GENERATION9_SUCCESSOR", "GENERATION10_SUCCESSOR")) {
            throw "Effective Gate received invalid dynamic receipt expectations."
          }
          $expectedGenerationId = [long]$expectedGenerationText
          $expectedEvidenceId = [long]$expectedEvidenceText
          $expectedReceiptCount = [long]$expectedReceiptCountText
          if ($receiptExitText -ne "0") {
            $stableCodes = ($receiptFailureCodes | Sort-Object -Unique) -join ","
            throw "CURRENT_SUBJECT_RECEIPT_VALIDATION_FAILED:exit=$receiptExitText status=$($receiptReport.validator_status) receipts=$($receiptReport.validated_receipt_count)/$($receiptReport.receipt_count) codes=$stableCodes"
          }
          if ([string]$receiptReport.expected_consumer_head_sha -cne $expectedHead -or
              [long]$receiptReport.generation_id -ne $expectedGenerationId -or
              [long]$receiptReport.resume_evidence_id -ne $expectedEvidenceId -or
              [string]$receiptReport.validation_mode -cne $expectedValidationMode -or
              [string]$receiptReport.required_check_context -cne "V076 Reuse and Point-Inertia Gate" -or
              $receiptReport.required_gate_consumer_fail_closed -ne $true -or
              [long]$receiptReport.receipt_count -ne $expectedReceiptCount -or
              [long]$receiptReport.validated_receipt_count -ne $expectedReceiptCount -or
              $receiptFailureCodes.Count -ne 0 -or
              $receiptBindings.Count -ne $expectedReceiptCount -or
              ($expectedGenerationId -eq 8 -and
                [string]$receiptReport.generation7_step11_receipt_status -cne "BLOCKED") -or
              ($expectedGenerationId -eq 9 -and (
                [string]$receiptReport.generation7_step11_receipt_status -cne "BLOCKED" -or
                [string]$receiptReport.generation8_step11_receipt_status -cne "BLOCKED"))) {
            throw "Effective Gate receipt contract mismatch: expected_head=$expectedHead actual_head=$($receiptReport.expected_consumer_head_sha) receipts=$($receiptReport.validated_receipt_count)/$($receiptReport.receipt_count) bindings=$($receiptBindings.Count)"
          }
          if ($rawOutcome -cne "success" -or $v2Outcome -cne "success") {
            throw "Effective Gate prerequisite tooling failed: raw_outcome=$rawOutcome v2_outcome=$v2Outcome"
          }
          if ($rawExitText -notmatch '^[01]$' -or $v2ExitText -notmatch '^[01]$') {
            throw "Effective Gate received invalid exit classifications: raw=$rawExitText v2=$v2ExitText"
          }
          try {
            $raw = Get-Content -LiteralPath $rawJson -Raw | ConvertFrom-Json
            $v2 = Get-Content -LiteralPath $v2Json -Raw | ConvertFrom-Json
          } catch {
            throw "Effective Gate could not parse Raw/V2 reports: $($_.Exception.Message)"
          }
          if ([string]$raw.head_sha -cne $expectedHead -or
              [string]$v2.evaluated_head_sha -cne $expectedHead -or
              [string]$v2.raw_report_head_sha -cne $expectedHead) {
            throw "Effective Gate report identity mismatch: expected=$expectedHead raw=$($raw.head_sha) v2=$($v2.evaluated_head_sha) v2_raw=$($v2.raw_report_head_sha)"
          }
          $expectedV2Status = "PASS_WITH_APPEND_ONLY_HISTORICAL_IDENTITY_BACKFILL_AND_CORRECTIONS"
          $spr = $v2.subject_projection_revalidation
          $sprV6 = $v2.subject_projection_revalidation_successor_v6
          $postTouch = $v2.post_touch_revalidation
          $hdm = $v2.historical_delta_metadata_ledger
          $hdmSuccessor = $v2.historical_delta_metadata_successor
          $zeroCounters = [ordered]@{
            raw_current_delta_failure_count = $v2.raw_current_delta_failure_count
            unresolved_historical_failure_count = $v2.unresolved_historical_failure_count
            true_active_violation_count = $v2.true_active_violation_count
            effective_blocking_failure_count = $v2.effective_blocking_failure_count
            scanner_rule_removal_count = $v2.scanner_rule_removal_count
            scanner_scope_reduction_count = $v2.scanner_scope_reduction_count
            scanner_severity_downgrade_count = $v2.scanner_severity_downgrade_count
            scanner_history_depth_reduction_count = $v2.scanner_history_depth_reduction_count
            current_delta_correction_false_accept_count = $v2.current_delta_correction_false_accept_count
            false_green_count = $v2.false_green_count
            correction_wildcard_count = $v2.correction_wildcard_count
            future_failure_auto_correction_count = $v2.future_failure_auto_correction_count
          }
          $invalidCounterNames = @(
            $zeroCounters.Keys |
              Where-Object {
                $property = $v2.PSObject.Properties[[string]$_]
                $null -eq $property -or $property.Value -isnot [long]
              }
          )
          if ($invalidCounterNames.Count -ne 0) {
            throw "Effective Gate report omitted exact integer counters: $($invalidCounterNames -join ', ')"
          }
          $nonZeroCounters = @(
            $zeroCounters.GetEnumerator() |
              Where-Object { [long]$_.Value -ne 0 } |
              ForEach-Object { "$($_.Key)=$($_.Value)" }
          )
          if ($nonZeroCounters.Count -ne 0) {
            throw "Effective Gate retained blocking or scanner-weakening counters: $($nonZeroCounters -join ', ')"
          }
          $sprV6ExactIntegerFields = @(
            "record_count",
            "trusted_fingerprint_count",
            "cross_authority_overlap_count",
            "wildcard_count",
            "future_failure_auto_correction_count"
          )
          $invalidSprV6IntegerFields = @(
            $sprV6ExactIntegerFields |
              Where-Object {
                $property = $sprV6.PSObject.Properties[[string]$_]
                $null -eq $property -or $property.Value -isnot [long]
              }
          )
          $sprV6ExactBooleanFields = @(
            "trust_set_parity",
            "identity_parity",
            "effective_authority_exposed"
          )
          $invalidSprV6BooleanFields = @(
            $sprV6ExactBooleanFields |
              Where-Object {
                $property = $sprV6.PSObject.Properties[[string]$_]
                $null -eq $property -or $property.Value -isnot [bool]
              }
          )
          $v2ExactIntegerFields = @(
            "raw_historical_failure_count",
            "corrected_historical_failure_count",
            "subject_projection_successor_v6_corrected_historical_failure_count"
          )
          $invalidV2ExactIntegerFields = @(
            $v2ExactIntegerFields |
              Where-Object {
                $property = $v2.PSObject.Properties[[string]$_]
                $null -eq $property -or $property.Value -isnot [long]
              }
          )
          $verifiedSprV6Property = $v2.PSObject.Properties[
            "verified_subject_projection_successor_v6_fingerprints"
          ]
          $verifiedSprV6Fingerprints = @(
            $v2.verified_subject_projection_successor_v6_fingerprints
          )
          $verifiedSprV6UniqueFingerprints = @(
            $verifiedSprV6Fingerprints | Sort-Object -Unique
          )
          $verifiedSprV6MalformedFingerprints = @(
            $verifiedSprV6Fingerprints |
              Where-Object { $_ -isnot [string] -or $_ -cnotmatch '^[0-9a-f]{64}$' }
          )
          if ($invalidSprV6IntegerFields.Count -ne 0 -or
              $invalidSprV6BooleanFields.Count -ne 0 -or
              $invalidV2ExactIntegerFields.Count -ne 0 -or
              $null -eq $verifiedSprV6Property -or
              $verifiedSprV6Property.Value -isnot [System.Array] -or
              $verifiedSprV6Fingerprints.Count -ne 2 -or
              $verifiedSprV6UniqueFingerprints.Count -ne 2 -or
              $verifiedSprV6MalformedFingerprints.Count -ne 0) {
            throw "Effective Gate omitted exact SPR-v6 fields: spr_v6_int=$($invalidSprV6IntegerFields -join ',') spr_v6_bool=$($invalidSprV6BooleanFields -join ',') v2_int=$($invalidV2ExactIntegerFields -join ',') verified_count=$($verifiedSprV6Fingerprints.Count)"
          }
          if ([string]$v2.resolution_mode -cne "FULL_CONVERGENCE" -or
              [string]$v2.status -cne $expectedV2Status -or
              $v2.full_convergence_terminal_coverage_verified -ne $true -or
              @($v2.failures).Count -ne 0 -or
              [string]$postTouch.status -cne "PASS" -or
              $postTouch.replacement_complete -ne $true -or
              [long]$postTouch.effective_trusted_fingerprint_count -ne 2 -or
              [string]$spr.status -cne "PASS" -or
              $spr.four_gate_complete -ne $true -or
              $spr.terminal_replacement_complete -ne $true -or
              [long]$spr.union_fingerprint_count -ne 109 -or
              [long]$spr.cross_epoch_overlap_count -ne 0 -or
              [long]$spr.successor_v4.trusted_fingerprint_count -ne 82 -or
              [long]$spr.successor_v5.trusted_fingerprint_count -ne 2 -or
              [long]$spr.successor_v3.trusted_fingerprint_count -ne 25 -or
              [string]$sprV6.status -cne "PASS" -or
              [string]$sprV6.primary_status -cne "PASS" -or
              [string]$sprV6.independent_status -cne "PASS" -or
              [long]$sprV6.record_count -ne 2 -or
              [long]$sprV6.trusted_fingerprint_count -ne 2 -or
              $sprV6.trust_set_parity -ne $true -or
              $sprV6.identity_parity -ne $true -or
              $sprV6.effective_authority_exposed -ne $true -or
              [long]$sprV6.cross_authority_overlap_count -ne 0 -or
              [long]$sprV6.wildcard_count -ne 0 -or
              [long]$sprV6.future_failure_auto_correction_count -ne 0 -or
              [long]$v2.raw_historical_failure_count -ne 589 -or
              [long]$v2.corrected_historical_failure_count -ne 589 -or
              [long]$v2.subject_projection_successor_v6_corrected_historical_failure_count -ne 2 -or
              @($v2.verified_subject_projection_successor_v6_fingerprints).Count -ne 2 -or
              [string]$hdm.status -cne "PASS" -or
              [string]$hdmSuccessor.status -cne "PASS") {
            throw "Effective Gate full-convergence contract mismatch: mode=$($v2.resolution_mode) status=$($v2.status) coverage=$($v2.full_convergence_terminal_coverage_verified) failures=$(@($v2.failures).Count) post_touch=$($postTouch.status)/$($postTouch.effective_trusted_fingerprint_count) spr=$($spr.status)/$($spr.union_fingerprint_count)/$($spr.cross_epoch_overlap_count)/v4=$($spr.successor_v4.trusted_fingerprint_count)/v5=$($spr.successor_v5.trusted_fingerprint_count)/v3=$($spr.successor_v3.trusted_fingerprint_count) spr_v6=$($sprV6.status)/$($sprV6.primary_status)/$($sprV6.independent_status)/$($sprV6.trusted_fingerprint_count)/overlap=$($sprV6.cross_authority_overlap_count) corrected=$($v2.corrected_historical_failure_count) hdm=$($hdm.status) hdm_successor=$($hdmSuccessor.status)"
          }

          Write-Output "RAW_SCANNER_EXIT_CODE=$rawExitText"
          Write-Output "V2_RESOLVER_EXIT_CODE=$v2ExitText"
          Write-Output "V076_FULL_CONVERGENCE_INPUT_SET=EXPLICIT_COMPLETE"
          Write-Output "V076_POST_TOUCH_EFFECTIVE_TRUSTED_FINGERPRINT_COUNT=$($postTouch.effective_trusted_fingerprint_count)"
          Write-Output "V076_SUBJECT_PROJECTION_UNION_FINGERPRINT_COUNT=$($spr.union_fingerprint_count)"
          Write-Output "V076_SUBJECT_PROJECTION_CROSS_EPOCH_OVERLAP_COUNT=$($spr.cross_epoch_overlap_count)"
          Write-Output "V076_SUBJECT_PROJECTION_SUCCESSOR_V6_TRUSTED_FINGERPRINT_COUNT=$($sprV6.trusted_fingerprint_count)"
          Write-Output "V076_SUBJECT_PROJECTION_SUCCESSOR_V6_CROSS_AUTHORITY_OVERLAP_COUNT=$($sprV6.cross_authority_overlap_count)"
          Write-Output "V076_HISTORICAL_DELTA_METADATA_STATUS=$($hdm.status)"
          Write-Output "V076_HISTORICAL_DELTA_METADATA_SUCCESSOR_STATUS=$($hdmSuccessor.status)"
          Write-Output "CI_GATE_READ_ONLY=true"
          Write-Output "CI_PRODUCT_RUNTIME_MUTATION_COUNT=0"
          Write-Output "CI_GAMEPLAY_EXECUTION_COUNT=0"
          Write-Output "CI_FULL_PRODUCT_REPROOF_COUNT=0"
          if ($v2ExitText -ne "0") {
            throw "V076 effective reuse and point-inertia Gate failed after V2 resolution."
          }
          Write-Output "V076_EFFECTIVE_GATE_STATUS=PASS"

      - name: Upload read-only gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v076-reuse-point-inertia-gate-${{ steps.pr_context.outputs.head }}
          path: |
            ${{ runner.temp }}/v076-reuse-point-inertia-selftest.json
            ${{ runner.temp }}/v076-reuse-correction-v2-selftest.json
            ${{ runner.temp }}/v076-current-subject-receipt-contract-selftest.json
            ${{ runner.temp }}/v076-generation10-step11-receipt-selftest.json
            ${{ runner.temp }}/v076-generation10-step11-runner-selftest.json
            ${{ runner.temp }}/v076-current-subject-receipt-validation.json
            ${{ runner.temp }}/v076-reuse-point-inertia-raw.json
            ${{ runner.temp }}/v076-reuse-point-inertia-raw.md
            ${{ runner.temp }}/v076-reuse-correction-v2.json
            ${{ runner.temp }}/v076-reuse-correction-v2.md
          if-no-files-found: error
          retention-days: 30

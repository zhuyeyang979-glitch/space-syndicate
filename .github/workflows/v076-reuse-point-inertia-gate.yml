name: V076 Reuse and Point-Inertia Gate

"on":
  pull_request:
    branches:
      - codex/v075-monster-military-combat-bd0af5c
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        default: "93"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: v076-reuse-point-inertia-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  reuse-point-inertia-gate:
    name: V076 Reuse and Point-Inertia Gate
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Resolve exact pull-request context
        id: pr_context
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          if ("${{ github.event_name }}" -eq "pull_request") {
            $pull = $event.pull_request
          } else {
            $prNumber = "${{ inputs.pr_number }}"
            if ($prNumber -notmatch '^\d+$') {
              throw "workflow_dispatch requires a numeric PR number: $prNumber"
            }
            $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            $pull = Invoke-RestMethod `
              -Method Get `
              -Uri "https://api.github.com/repos/${{ github.repository }}/pulls/$prNumber" `
              -Headers $headers
          }
          $head = [string]$pull.head.sha
          $base = [string]$pull.base.sha
          $number = [string]$pull.number
          if ($head -notmatch '^[0-9a-f]{40}$' -or $base -notmatch '^[0-9a-f]{40}$') {
            throw "Resolved PR identity is incomplete: number=$number base=$base head=$head"
          }
          $contextPath = Join-Path $env:RUNNER_TEMP "v076-pr-context.json"
          [pscustomobject]@{
            number = [int]$number
            head_sha = $head
            base_sha = $base
            body = [string]$pull.body
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $contextPath -Encoding utf8
          "head=$head" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "base=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "number=$number" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ steps.pr_context.outputs.head }}

      - name: Verify exact identity and clean source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedHead = "${{ steps.pr_context.outputs.head }}"
          $baseHead = "${{ steps.pr_context.outputs.base }}"
          $actualHead = (git rev-parse HEAD).Trim()
          if ($actualHead -cne $expectedHead) {
            throw "Checkout mismatch: expected=$expectedHead actual=$actualHead"
          }
          & git merge-base --is-ancestor $baseHead $actualHead
          if ($LASTEXITCODE -ne 0) {
            throw "PR head is not a descendant of its exact base: base=$baseHead head=$actualHead"
          }
          $status = (& git status --porcelain=v1 -uall | Out-String).Trim()
          if (-not [string]::IsNullOrEmpty($status)) {
            throw "Gate checkout must start clean: $status"
          }
          git diff --check "$baseHead...$actualHead"
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed for $baseHead...$actualHead"
          }

      - name: Resolve the exact gate delta base
        id: gate_base
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $event = Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $head = "${{ steps.pr_context.outputs.head }}"
          $gateBase = "f6fe547e1e1db57a8bb3a12eab1d9225d4abdca5"
          $ledgerPath = "docs/architecture/V076_INHERITED_GREEN_LEDGER.json"
          $ledger = Get-Content -LiteralPath $ledgerPath -Raw | ConvertFrom-Json
          $declaredBase = [string]$ledger.point_inertia_baseline_sha
          if ($declaredBase -cne $gateBase) {
            throw "Ledger cannot redefine the external activation baseline: declared=$declaredBase required=$gateBase"
          }
          & git cat-file -e "$gateBase^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical point-inertia baseline commit is unavailable: $gateBase"
          }
          & git merge-base --is-ancestor $gateBase $head
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical point-inertia baseline is not an ancestor: base=$gateBase head=$head"
          }

          if ([string]$event.action -eq "synchronize") {
            $before = [string]$event.before
            if ($before -notmatch '^[0-9a-f]{40}$') {
              throw "Synchronize event lacks an exact before identity: $before"
            }
            & git merge-base --is-ancestor $before $head
            if ($LASTEXITCODE -ne 0) {
              throw "Non-fast-forward synchronize history drift: before=$before head=$head"
            }
            & git merge-base --is-ancestor $gateBase $before
            if ($LASTEXITCODE -ne 0) {
              throw "Synchronize before predates or diverges from Gate activation: activation=$gateBase before=$before"
            }
          }

          "gate_base=$gateBase" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "V076_GATE_BASE_REF=$gateBase"
          Write-Output "V076_GATE_BASE_SOURCE=external_activation_boundary"

      - name: Run existing 120/120 self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receiptPath = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-selftest.json"
          $receiptLines = & python tools/v076/v076_reuse_point_inertia_gate_selftest.py
          $selftestExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $receiptPath,
            (($receiptLines -join "`n").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          } catch {
            throw "Existing reuse self-test did not emit a valid JSON receipt: $($_.Exception.Message)"
          }
          $caseCount = [int]$receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_CASE_COUNT
          $passCount = [int]$receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_PASS_COUNT
          if (
            $selftestExit -ne 0 -or
            [string]$receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_STATUS -cne "PASS" -or
            $caseCount -lt 120 -or
            $passCount -ne $caseCount
          ) {
            throw "Existing reuse self-test failed: exit=$selftestExit status=$($receipt.REUSE_POINT_INERTIA_GATE_SELFTEST_STATUS) pass=$passCount/$caseCount"
          }
          "Existing reuse self-test: PASS ($passCount/$caseCount)" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run V2 exact-correction self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receiptPath = Join-Path $env:RUNNER_TEMP "v076-reuse-correction-v2-selftest.json"
          $receiptLines = & python tools/v076/v076_reuse_exact_failure_correction_v2_selftest.py
          $selftestExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $receiptPath,
            (($receiptLines -join "`n").TrimEnd() + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          try {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          } catch {
            throw "V2 correction self-test did not emit a valid JSON receipt: $($_.Exception.Message)"
          }
          $caseCount = [int]$receipt.CORRECTION_V2_SELFTEST_CASE_COUNT
          $passCount = [int]$receipt.CORRECTION_V2_SELFTEST_PASS_COUNT
          if (
            $selftestExit -ne 0 -or
            [string]$receipt.CORRECTION_V2_SELFTEST_STATUS -cne "PASS" -or
            $caseCount -lt 60 -or
            $passCount -ne $caseCount
          ) {
            throw "V2 correction self-test failed: exit=$selftestExit status=$($receipt.CORRECTION_V2_SELFTEST_STATUS) pass=$passCount/$caseCount"
          }
          "V2 exact-correction self-test: PASS ($passCount/$caseCount)" |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Verify sealed V2 evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $verificationLines = & python tools/v076/v076_reuse_exact_failure_correction_v2.py seal-evidence `
            --project $env:GITHUB_WORKSPACE `
            --output-root $env:GITHUB_WORKSPACE `
            --verify-only
          $verificationExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($verificationExit -ne 0) {
            throw "Sealed V2 evidence verification tooling failure: exit=$verificationExit"
          }
          $verificationJson = ($verificationLines -join "`n").Trim()
          try {
            $verification = $verificationJson | ConvertFrom-Json
          } catch {
            throw "Sealed V2 evidence verification emitted invalid JSON: $($_.Exception.Message)"
          }
          $mutationProperty = $verification.PSObject.Properties[
            "POST_MANIFEST_INPUT_MUTATION_COUNT"
          ]
          if (
            [string]$verification.status -cne "VERIFIED" -or
            $null -eq $mutationProperty -or
            $mutationProperty.Value -isnot [long] -or
            [long]$mutationProperty.Value -ne 0 -or
            [string]$verification.REUSE_GATE_STATUS -cne "FAIL"
          ) {
            throw "Sealed V2 evidence verification mismatch: status=$($verification.status) mutation_count=$($verification.POST_MANIFEST_INPUT_MUTATION_COUNT) reuse_gate_status=$($verification.REUSE_GATE_STATUS)"
          }
          "Sealed V2 evidence: VERIFIED; post-manifest mutations: 0; sealed Gate status: FAIL (hard-stop preserved)." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run Raw Scanner and emit Raw Report
        id: raw_report
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $context = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "v076-pr-context.json") -Raw | ConvertFrom-Json
          $prBodyPath = Join-Path $env:RUNNER_TEMP "v076-pr-body.md"
          $rawJson = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-raw.json"
          $rawMarkdown = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-raw.md"
          [IO.File]::WriteAllText(
            $prBodyPath,
            [string]$context.body,
            [Text.UTF8Encoding]::new($false)
          )

          # Exit 1 is the scanner's expected raw-failure result.  Preserve it
          # for V2 instead of terminating before exact correction resolution.
          $global:LASTEXITCODE = 0
          & python tools/v076/v076_reuse_point_inertia_gate.py validate `
            --project $env:GITHUB_WORKSPACE `
            --pr-base-ref "${{ steps.pr_context.outputs.base }}" `
            --inertia-base-ref "${{ steps.gate_base.outputs.gate_base }}" `
            --gate-base-ref "${{ steps.gate_base.outputs.gate_base }}" `
            --head-ref "${{ steps.pr_context.outputs.head }}" `
            --pr-body-file $prBodyPath `
            --report-json $rawJson `
            --report-md $rawMarkdown
          $rawExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          "exit_code=$rawExit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($rawExit -lt 0 -or $rawExit -ge 2) {
            throw "Raw Scanner tooling error: exit=$rawExit"
          }
          if (-not (Test-Path -LiteralPath $rawJson -PathType Leaf) -or
              -not (Test-Path -LiteralPath $rawMarkdown -PathType Leaf)) {
            throw "Raw Scanner did not emit both required reports: json=$rawJson markdown=$rawMarkdown exit=$rawExit"
          }
          try {
            $raw = Get-Content -LiteralPath $rawJson -Raw | ConvertFrom-Json
          } catch {
            throw "Raw Scanner emitted invalid JSON: $($_.Exception.Message)"
          }
          $rawStatus = [string]$raw.status
          if (($rawExit -eq 0 -and $rawStatus -cne "PASS") -or
              ($rawExit -eq 1 -and $rawStatus -cne "FAIL")) {
            throw "Raw Scanner exit/report mismatch: exit=$rawExit status=$rawStatus"
          }
          Get-Content -LiteralPath $rawMarkdown -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($rawExit -eq 1) {
            Write-Warning "Raw Scanner found failures; V2 Resolver will determine the effective Gate result."
          }

      - name: Run V2 Resolver and emit V2 Report
        id: v2_resolver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rawJson = Join-Path $env:RUNNER_TEMP "v076-reuse-point-inertia-raw.json"
          $v2Json = Join-Path $env:RUNNER_TEMP "v076-reuse-correction-v2.json"
          $v2Markdown = Join-Path $env:RUNNER_TEMP "v076-reuse-correction-v2.md"
          if (-not (Test-Path -LiteralPath $rawJson -PathType Leaf)) {
            throw "V2 Resolver requires the Raw Scanner report: $rawJson"
          }

          # Exit 1 is a genuine effective Gate failure, not a tooling failure.
          # Keep this step successful long enough to publish both reports and
          # let the final Effective Gate enforce the result exactly once.
          $global:LASTEXITCODE = 0
          & python tools/v076/v076_reuse_exact_failure_correction_v2.py resolve `
            --project $env:GITHUB_WORKSPACE `
            --output-root $env:GITHUB_WORKSPACE `
            --head-ref "${{ steps.pr_context.outputs.head }}" `
            --raw-report $rawJson `
            --report-json $v2Json `
            --report-md $v2Markdown
          $v2Exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          "exit_code=$v2Exit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($v2Exit -lt 0 -or $v2Exit -ge 2) {
            throw "V2 Resolver tooling error: exit=$v2Exit"
          }
          if (-not (Test-Path -LiteralPath $v2Json -PathType Leaf) -or
              -not (Test-Path -LiteralPath $v2Markdown -PathType Leaf)) {
            throw "V2 Resolver did not emit both required reports: json=$v2Json markdown=$v2Markdown exit=$v2Exit"
          }
          try {
            $v2 = Get-Content -LiteralPath $v2Json -Raw | ConvertFrom-Json
          } catch {
            throw "V2 Resolver emitted invalid JSON: $($_.Exception.Message)"
          }
          $v2Status = [string]$v2.status
          $passStatus = "PASS_WITH_APPEND_ONLY_HISTORICAL_CORRECTIONS"
          $failStatus = "FAIL"
          if (($v2Exit -eq 0 -and $v2Status -cne $passStatus) -or
              ($v2Exit -eq 1 -and $v2Status -cne $failStatus)) {
            throw "V2 Resolver exit/report mismatch: exit=$v2Exit status=$v2Status"
          }
          Get-Content -LiteralPath $v2Markdown -Raw |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if ($v2Exit -eq 1) {
            Write-Warning "V2 Resolver found unresolved or active effective blockers."
          }

      - name: Enforce Effective Gate
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rawOutcome = "${{ steps.raw_report.outcome }}"
          $v2Outcome = "${{ steps.v2_resolver.outcome }}"
          $rawExitText = "${{ steps.raw_report.outputs.exit_code }}"
          $v2ExitText = "${{ steps.v2_resolver.outputs.exit_code }}"

          $repositoryStatus = (& git status --porcelain=v1 -uall | Out-String).Trim()
          if (-not [string]::IsNullOrEmpty($repositoryStatus)) {
            throw "Gate mutated the repository; reports must remain in RUNNER_TEMP: $repositoryStatus"
          }
          if ($rawOutcome -cne "success" -or $v2Outcome -cne "success") {
            throw "Effective Gate prerequisite tooling failed: raw_outcome=$rawOutcome v2_outcome=$v2Outcome"
          }
          if ($rawExitText -notmatch '^[01]$' -or $v2ExitText -notmatch '^[01]$') {
            throw "Effective Gate received invalid exit classifications: raw=$rawExitText v2=$v2ExitText"
          }

          Write-Output "RAW_SCANNER_EXIT_CODE=$rawExitText"
          Write-Output "V2_RESOLVER_EXIT_CODE=$v2ExitText"
          Write-Output "CI_GATE_READ_ONLY=true"
          Write-Output "CI_PRODUCT_RUNTIME_MUTATION_COUNT=0"
          Write-Output "CI_GAMEPLAY_EXECUTION_COUNT=0"
          Write-Output "CI_FULL_PRODUCT_REPROOF_COUNT=0"
          if ($v2ExitText -ne "0") {
            throw "V076 effective reuse and point-inertia Gate failed after V2 resolution."
          }
          Write-Output "V076_EFFECTIVE_GATE_STATUS=PASS"

      - name: Upload read-only gate reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v076-reuse-point-inertia-gate-${{ steps.pr_context.outputs.head }}
          path: |
            ${{ runner.temp }}/v076-reuse-point-inertia-selftest.json
            ${{ runner.temp }}/v076-reuse-correction-v2-selftest.json
            ${{ runner.temp }}/v076-reuse-point-inertia-raw.json
            ${{ runner.temp }}/v076-reuse-point-inertia-raw.md
            ${{ runner.temp }}/v076-reuse-correction-v2.json
            ${{ runner.temp }}/v076-reuse-correction-v2.md
          if-no-files-found: error
          retention-days: 30
